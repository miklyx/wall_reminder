apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-reminder-backend
  namespace: android-reminder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: android-reminder-backend
  template:
    metadata:
      labels:
        app: android-reminder-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: android-reminder-backend
        image: ghcr.io/miklyx/wall_reminder/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REMINDER_API_KEY
          valueFrom:
            secretKeyRef:
              name: android-reminder-backend
              key: REMINDER_API_KEY
        - name: REMINDER_DB_PATH
          value: /data/reminders.sqlite3
        - name: GOOGLE_CLOUD_PROJECT
          value: wall-reminder-161
        - name: REMINDER_POLL_SECONDS
          value: "1"
        - name: REMINDER_RETRY_SECONDS
          value: "30"
        - name: FCM_RETRY_SECONDS
          value: "300"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/secrets/firebase-admin/firebase-admin.json
        volumeMounts:
        - name: firebase-admin
          mountPath: /var/run/secrets/firebase-admin
          readOnly: true
      volumes:
      - name: firebase-admin
        secret:
          secretName: firebase-admin
          optional: true
          items:
          - key: firebase-admin.json
            path: firebase-admin.json
---
apiVersion: v1
kind: Service
metadata:
  name: android-reminder-backend-service
  namespace: android-reminder
spec:
  type: ClusterIP
  selector:
    app: android-reminder-backend
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: android-reminder-backend-ingress
  namespace: android-reminder
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: android-reminder-strip-reminder-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /android-reminder
        pathType: Prefix
        backend:
          service:
            name: android-reminder-backend-service
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-reminder-prefix
  namespace: android-reminder
spec:
  stripPrefix:
    prefixes:
    - /android-reminder
