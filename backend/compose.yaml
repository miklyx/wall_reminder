services:
  reminder-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${REMINDER_PORT:-8000}:8000"
    environment:
      REMINDER_API_KEY: ${REMINDER_API_KEY:?Set REMINDER_API_KEY in backend/.env}
      REMINDER_DB_PATH: /data/reminders.sqlite3
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-wall-reminder-161}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-1}
      REMINDER_RETRY_SECONDS: ${REMINDER_RETRY_SECONDS:-30}
      FCM_RETRY_SECONDS: ${FCM_RETRY_SECONDS:-300}
    volumes:
      - reminder_data:/data
      - ${FIREBASE_ADMIN_KEY_FILE:?Set FIREBASE_ADMIN_KEY_FILE to the Admin SDK JSON path}:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  reminder_data:
