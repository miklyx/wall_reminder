apiVersion: v1
kind: Namespace
metadata:
  name: pihole
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8081
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-web
  namespace: pihole
  labels:
    kubernetes.io/service-name: pihole-web
    endpointslice.kubernetes.io/managed-by: wall-reminder-manual
addressType: IPv4
ports:
- name: http
  port: 8081
  protocol: TCP
endpoints:
- addresses:
  - 192.168.178.29
  conditions:
    ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole-web
  namespace: pihole
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pihole-redirect-root@kubernetescrd,pihole-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /pi-hole
        pathType: Prefix
        backend:
          service:
            name: pihole-web
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: pihole
spec:
  stripPrefix:
    prefixes:
    - /pi-hole
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-root
  namespace: pihole
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/pi-hole/?$
    replacement: ${1}/pi-hole/admin/
    permanent: false
